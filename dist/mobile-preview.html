<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas Vivo — prévia mobile</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#092f50;font-family:Arial,sans-serif}.device{width:414px;max-width:100%;padding:12px;border-radius:34px;background:#17212c;box-shadow:0 20px 55px #0008}.device-bar{height:24px;margin:0 auto 10px;width:128px;border-radius:999px;background:#05090d}.device iframe{display:block;width:390px;height:min(844px,calc(100vh - 86px));margin:auto;border:0;border-radius:23px;background:#fff}.label{margin:12px 0 0;color:#fff4d3;text-align:center;font:700 12px/1.3 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}@media(max-width:430px){.device{padding:7px;border-radius:0}.device iframe{height:calc(100vh - 62px);border-radius:0}}
  </style>
</head>
<body>
  <main class="device" aria-label="Moldura de celular com prévia do Atlas Vivo">
    <div class="device-bar" aria-hidden="true"></div>
    <iframe id="mobile-site" src="./?mobile-review=20#hero" title="Prévia mobile do Atlas Vivo da Bíblia"></iframe>
    <p class="label">Prévia mobile · 390px</p>
  </main>
</body>
<script>
  const mobileSite = document.getElementById('mobile-site');
  const mobileSection = new URLSearchParams(location.search).get('section');
  if (mobileSection) mobileSite.src = `./?mobile-review=20#${mobileSection}`;
  mobileSite.addEventListener('load', (event) => {
    const doc = event.target.contentDocument;
    if (!doc || doc.getElementById('draft-preview-v3')) return;
    const script = doc.createElement('script');
    script.id = 'draft-preview-v3';
    script.src = 'draft-preview-v3.js?v=25';
    doc.body.append(script);
  });
</script>
</html>

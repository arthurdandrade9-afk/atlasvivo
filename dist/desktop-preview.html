<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas Vivo — prévia desktop</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#092f50;font-family:Arial,sans-serif}.desktop{width:min(1440px,100vw);padding:14px;background:#17212c;box-shadow:0 20px 55px #0008}.desktop-bar{height:30px;margin:0 0 12px;border-radius:8px;background:#0b131b}.desktop iframe{display:block;width:100%;height:calc(100vh - 82px);border:0;background:#fff}.label{margin:10px 0 0;color:#fff4d3;text-align:center;font:700 12px/1.3 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}@media(max-width:800px){.desktop{padding:0}.desktop-bar,.label{display:none}.desktop iframe{height:100vh}}
  </style>
</head>
<body>
  <main class="desktop" aria-label="Moldura desktop com prévia do Atlas Vivo">
    <div class="desktop-bar" aria-hidden="true"></div>
    <iframe id="desktop-site" src="./#inclusos" title="Prévia desktop do Atlas Vivo da Bíblia"></iframe>
    <p class="label">Prévia desktop · 1412px</p>
  </main>
</body>
<script>
  document.getElementById('desktop-site').addEventListener('load', (event) => {
    const doc = event.target.contentDocument;
    if (!doc || doc.getElementById('draft-preview-v3')) return;
    const script = doc.createElement('script');
    script.id = 'draft-preview-v3';
    script.src = 'draft-preview-v3.js';
    doc.body.append(script);
  });
</script>
</html>
